:root { --bg: #f3f5f7; --panel: #ffffff; --ink: #14202b; --muted: #5d6b78; --line: #d9e0e6; --accent: #1f5f8b; --bad: #b23b2e; }

label { font-size: 14px; display: flex; gap: 8px; align-items: center; }
button { padding: 10px; font-size: 15px; font-weight: 600; border: 0; border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer; }
#msg { color: var(--bad); font-size: 14px; min-height: 18px; }
